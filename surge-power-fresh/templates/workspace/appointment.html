<p><a href="{{url_for('calendar_view',month=visit.start.strftime('%Y-%m'))}}">← Calendar</a></p><div class="record-heading"><div><p class="eyebrow">VISIT</p><h1>{{person.name}}</h1><p>{{person.location or 'Location pending'}} · {{person.contact}}</p></div><div class="record-actions"><a class="button" href="https://www.google.com/maps/search/?api=1&query={{person.location|urlencode}}" target="_blank" rel="noopener">Directions ↗</a><a class="button primary-action" href="{{url_for('inquiry_detail',ident=person.id)}}">Open project</a></div></div><section class="panel appointment-editor"><h2>Edit visit</h2><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Service date<input type="date" name="service_date" value="{{visit.start.date()}}" required></label><fieldset class="time-range"><legend>Visit time</legend><label>Start<input type="time" name="start_time" value="{{visit.start.strftime('%H:%M')}}" required></label><span>to</span><label>End<input type="time" name="end_time" value="{{visit.end.strftime('%H:%M')}}" required></label></fieldset><label>Status<select name="status">{% for state in statuses %}<option {{'selected' if visit.status==state}}>{{state}}</option>{% endfor %}</select></label><label class="span-full">Notes<textarea name="notes" rows="5">{{visit.notes}}</textarea></label><button>Save visit</button></form></section>
