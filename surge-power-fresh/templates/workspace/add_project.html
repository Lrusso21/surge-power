<p><a href="{{url_for('dashboard')}}">← Today</a></p><h1>{{'Add project for ' + customer.name if customer else 'Add inquiry'}}</h1><p>Use this for calls, referrals, Instagram messages, or a returning customer.</p><form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="customer_id" value="{{customer.id if customer else ''}}"><label>Customer name<input name="name" value="{{customer.name if customer else ''}}" required maxlength="100"></label><label>Phone or email<input name="contact" value="{{customer.contact if customer else ''}}" required maxlength="200"></label><label>Preferred contact<select name="preferred_contact"><option>contact</option><option>phone</option><option>email</option></select></label><label>Lead source<select name="source"><option value="manual">Call or referral</option><option value="instagram">Instagram</option><option value="website">Website</option><option value="repeat">Returning customer</option></select></label><label>Service<select name="service">{% for service in services %}<option>{{service}}</option>{% endfor %}</select></label><label>Project title<input name="project_title" placeholder="Example: Garage EV charger"></label><label>City or area<input name="location" maxlength="100"></label><label class="span-full">Project details<textarea name="details" rows="5" maxlength="3000"></textarea></label><button>Add project</button></form>
